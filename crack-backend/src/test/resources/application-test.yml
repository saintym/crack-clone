spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

crack:
  data-path: ${java.io.tmpdir}/crack-test-data
  ai:
    default-provider: fake
    fake:
      enabled: true
    cli:
      path: claude-not-installed

claude:
  api-key: ""          # 빈 키 → claude-api는 사용 불가. 테스트는 실제 AI를 호출하지 않는다
  max-tokens: 100
